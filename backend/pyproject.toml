[project]
name = "test-http-mcp"
authors = [{ name = "Yeison Liscano", email = "yliscanoc@gmail.com" }]
maintainers = [{ name = "Yeison Liscano", email = "yliscanoc@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["mcp", "llm", "automation", "http"]
description = "This is a HTTP implementation of the MCP protocol"
license = "MIT"
license-files = ["../LICENSE"]
requires-python = ">=3.13,<3.14"
version = "0.0.1"

dependencies = [
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
    "starlette==1.10.0",
    "http-mcp[auth]==0.19.0rc2",
    "auth0-api-python==1.0.0b10",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "pydantic-ai-slim[anthropic,duckduckgo,web-fetch]==2.66.0",
    "pydantic-ai-harness[prompt-injection-defender]==0.66.0",
]

[dependency-groups]
dev = [
    "mcp==2.3.0",
    "mdformat==1.0.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.1.post1",
    "py-mocks==0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
run-app = "app.main:run_http"
run-stdio = "app.main:run_stdio"
run-app-local = "app.app:main"

[project.urls]
Homepage = "https://github.com/yeison-liscano/test-http-mcp"
Issues = "https://github.com/yeison-liscano/test-http-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
microsoft-python-type-stubs = { git = "https://github.com/microsoft/python-type-stubs.git" }
